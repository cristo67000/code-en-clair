<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galerie des schémas</title>
<link rel="stylesheet" href="../css/theme.css">
<link rel="stylesheet" href="../css/schema.css">
<style>
  /* Outil de développement : montre tous les schémas, l'un sous l'autre, à la
     largeur d'un téléphone. Non livré (pas dans le service worker). */
  body { margin: 0; background: var(--fond); color: var(--encre); font: 14px/1.4 var(--sans); }
  main { max-width: 400px; margin: 0 auto; padding: 8px; }
  h2 { font: 600 12px var(--mono); margin: 14px 0 4px; color: var(--encre-douce); }
  figure { margin: 0; padding: 8px; background: var(--carte); border: 1px solid var(--trait); border-radius: 12px; }
  figcaption { font-size: 12px; color: var(--encre-douce); margin: 4px 2px 0; }
</style>
</head>
<body>
<main id="galerie"></main>
<script src="../js/outils.js"></script>
<script src="../js/schema.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const langue = params.get('l') || 'fr';
  if (params.get('theme')) document.documentElement.dataset.theme = params.get('theme');
  const filtre = params.get('q') || '';
  const liste = params.get('n') ? params.get('n').split(',') : null;   // des noms exacts
  const fichiers = (params.get('f') || 'git,shell,web,reseau,data,secu,langage,outils,image,bdd,mobile,ia,qualite,archi').split(',');
  window.Schemas = {};
  (async function () {
    for (const f of fichiers) {
      await new Promise((ok) => {
        const s = document.createElement('script');
        s.src = '../js/schemas/' + f + '.js';
        s.onload = ok; s.onerror = ok;
        document.head.appendChild(s);
      });
    }
    const cible = document.getElementById('galerie');
    let n = 0;
    for (const nom of Object.keys(window.Schemas)) {
      if (filtre && !nom.includes(filtre)) continue;
      if (liste && !liste.includes(nom)) continue;
      const spec = window.Schemas[nom];
      const fig = document.createElement('figure');
      fig.id = 's-' + nom;
      const h = document.createElement('h2');
      h.textContent = nom + '  (' + spec.k + ')';
      cible.appendChild(h);
      try {
        fig.appendChild(Schema.dessiner(spec, langue));
        const c = Schema.legende(spec, langue);
        if (c) { const cap = document.createElement('figcaption'); cap.textContent = c; fig.appendChild(cap); }
      } catch (e) {
        fig.textContent = 'ERREUR : ' + e.message;
        fig.style.color = 'red';
      }
      cible.appendChild(fig);
      n += 1;
    }
    document.title = n + ' schémas';
    document.body.dataset.pret = String(n);
  })();
</script>
</body>
</html>
